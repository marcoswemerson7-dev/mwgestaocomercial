name: Exportar logomarcas PNG
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/export-brand-png.yml
      - public/brands/*.svg
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow==11.3.0
      - name: Criar PNGs transparentes
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import io
          import re
          from pathlib import Path
          from PIL import Image

          for stem in ('supermercado-vitoria', 'acai-vitoria'):
              src=Path('public/brands')/(stem+'.svg')
              xml=src.read_text(encoding='utf-8')
              match=re.search(r'data:image/webp;base64,([A-Za-z0-9+/=]+)',xml)
              if not match:
                  raise RuntimeError(f'Imagem incorporada ausente: {src}')
              image=Image.open(io.BytesIO(base64.b64decode(match.group(1)))).convert('RGBA')
              image=image.resize((image.width*4,image.height*4),Image.Resampling.LANCZOS)
              image.save(Path('public/brands')/(stem+'.png'),format='PNG',optimize=True)
          PY
      - name: Versionar logomarcas PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/brands/supermercado-vitoria.png public/brands/acai-vitoria.png
          if ! git diff --cached --quiet; then
            git commit -m "assets: adicionar logomarcas PNG transparentes"
            git push
          fi
